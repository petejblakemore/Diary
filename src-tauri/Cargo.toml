[package]
name = "diary"
version = "1.0.0"
description = "A sovereign, local-only diary"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
regex = "1"
walkdir = "2"
# Bundled libgit2, no network features: the app never needs system Git.
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2"] }
# Only used for the optional daily weather line (rustls, no OpenSSL).
ureq = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
